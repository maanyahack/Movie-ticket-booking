<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon from public folder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Descriptive title shown in browser tab and search results -->
    <title>CineVerse — Movie Ticket Booking</title>
    <meta name="description" content="Book movie tickets online instantly. Browse now-showing films, pick your seat and pay securely — all in one place." />

    <!-- Google Fonts: Inter is a clean, modern font used by many top apps -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      React mounts the ENTIRE app inside this one div.
      When React loads, it replaces this div's contents with our JSX.
      This is what makes it a "Single Page Application" (SPA).
    -->
    <div id="root"></div>

    <!-- Vite serves our JSX as an ES module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
